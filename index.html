<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestro Universo, Karla</title>
  <meta name="description" content="Un universo de recuerdos creado con amor, donde cada estrella guarda un momento especial nuestro." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- 3D INTRO SCENE (Three.js r163) -->
  <div id="intro-screen">
    <canvas id="intro-canvas"></canvas>
    
    <!-- White-out transition overlay -->
    <div id="intro-whiteout"></div>

    <div id="intro-overlay">
      <button id="music-toggle" class="music-btn" title="Activar/Desactivar Música">
        <span class="icon">♪</span>
        <span class="text">Música: OFF</span>
      </button>
      <audio id="bg-music" loop>
        <source src="https://www.chosic.com/wp-content/uploads/2021/04/And-So-It-Begins-Inspired-By-Crush-By-Sarcastic-Sounds.mp3" type="audio/mpeg">
      </audio>

      <div class="intro-floating-content">
        <div class="intro-date-badge">20 · ENE · 2026</div>

        <h1 class="intro-title">
          <span class="title-line1">Nuestro Universo,</span>
          <span class="title-line2">Karla</span>
        </h1>

        <p id="subtitle-text" class="intro-subtitle"></p>

        <div class="counter-strip">
          <div class="counter-item">
            <span id="cnt-days" class="cnt-val">00</span>
            <span class="cnt-label">días</span>
          </div>
          <div class="counter-divider">·</div>
          <div class="counter-item">
            <span id="cnt-hours" class="cnt-val">00</span>
            <span class="cnt-label">horas</span>
          </div>
          <div class="counter-divider">·</div>
          <div class="counter-item">
            <span id="cnt-mins" class="cnt-val">00</span>
            <span class="cnt-label">minutos</span>
          </div>
          <div class="counter-divider">·</div>
          <div class="counter-item">
            <span id="cnt-secs" class="cnt-val">00</span>
            <span class="cnt-label">segundos</span>
          </div>
        </div>
        <p class="counter-caption">juntos, desde el primer "¿juegas Fortnite?"</p>

        <button id="enter-btn" class="enter-btn">
          <span>Explorar el Universo</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 3D UNIVERSE -->
  <div id="universe-screen" class="hidden">
    <canvas id="three-canvas"></canvas>

    <div id="hint-toast">
      <span>🌌 Arrastra para explorar · Haz clic en las estrellas brillantes</span>
    </div>

    <div id="universe-ui">
      <button id="back-btn" class="back-btn" title="Volver al Iglú">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Volver al Iglú</span>
      </button>

      <button id="add-star-btn" class="add-star-btn">
        <span>+ Crear Estrella</span>
      </button>
    </div>

    <!-- Star Detail Overlay -->
    <div id="card-overlay" class="hidden">
      <div id="memory-card">
        <button id="card-close" class="close-btn">&times;</button>
        <div id="card-content">
          <div id="card-header">
            <span id="card-emoji" class="card-emoji">📸</span>
            <span id="card-date-badge" class="date-badge"></span>
          </div>
          <h2 id="card-title"></h2>
          <div id="card-gallery"></div>
          <p id="card-desc"></p>
        </div>
      </div>
    </div>

    <!-- Create Star Modal -->
    <div id="create-star-modal" class="hidden">
      <div id="modal-content">
        <button id="create-star-close" class="close-btn">&times;</button>
        <h2>Nueva Estrella</h2>
        <form id="create-star-form">
          <label for="star-title">Título del Recuerdo:</label>
          <input type="text" id="star-title" required placeholder="Ej. Nuestro viaje a la playa" />

          <label for="star-desc">Mensaje / Descripción:</label>
          <textarea id="star-desc" required placeholder="Escribe lo que sientes..."></textarea>

          <label for="star-emoji">Emoji:</label>
          <input type="text" id="star-emoji" required placeholder="Ej. 🏖️" maxlength="2" />

          <label for="star-color">Color de la Estrella:</label>
          <input type="color" id="star-color" value="#ffffff" />

          <button type="submit" id="create-star-submit">Crear y Lanzar Estrella 🚀</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts: Modern Three.js r163 with Addons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/",
        "@splinetool/loader": "https://unpkg.com/@splinetool/loader@1.9.5/build/SplineLoader.js"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE; // Provide global access for memories.js/app.js legacy integration
  </script>

  <script src="memories.js?v=5.3.0"></script>
  <script type="module" src="intro_final.js?v=5.3.0"></script>
  <script type="module" src="app.js?v=5.3.0"></script>
</body>
</html>
